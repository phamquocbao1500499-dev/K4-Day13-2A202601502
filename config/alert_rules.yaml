alerts:
  - name: high_latency_p95
    summary: Users are waiting more than three seconds for chat responses.
    severity: warning
    condition: latency_p95_ms > 3000 for 5m
    type: symptom-based
    owner: on-call-engineer
    sli: latency_p95_ms
    objective: 3000
    runbook: docs/alerts.md#alert-1

  - name: elevated_error_rate
    summary: More than two percent of chat requests are failing.
    severity: critical
    condition: error_rate_pct > 2 for 3m
    type: symptom-based
    owner: on-call-engineer
    sli: error_rate_pct
    objective: 2
    runbook: docs/alerts.md#alert-2

  - name: cost_budget_exceeded
    summary: Rolling 24-hour model cost has exceeded the daily budget.
    severity: warning
    condition: daily_cost_usd > 2.5 for 5m
    type: symptom-based
    owner: team-lead
    sli: daily_cost_usd
    objective: 2.5
    runbook: docs/alerts.md#alert-3
